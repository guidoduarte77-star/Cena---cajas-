="stage='boxes';render()">Empezar el juego</button>`;if(stage==='boxes')card.innerHTML=`<div class="sub">Momento decisivo</div><h1>Elegí una de las 3 cajas 🎁</h1><p class="muted">La que elijas define el menú de esta noche. 👀</p><div class="boxes">${[1,2,3].map(n=>`<button class="box" onclick="pick(${n})"><span class="gift">🎁</span>CAJA ${n}</button>`).join('')}</div>`;if(stage==='confirm')card.innerHTML=`<div class="heart">🎁</div><div class="sub">Elegiste la caja ${choice}</div><h1>¿Segura? 😏</h1><p class="muted">Antes de abrirla tenés una última oportunidad. ¿Te quedás con esta o querés cambiarla?</p><div class="row"><button class="action" onclick="openBox()">🔒 Me quedo con esta</button><button class="action secondary" onclick="stage='boxes';choice=null;render()">🔄 Quiero cambiarla</button></div>`;if(stage==='count')card.innerHTML=`<div class="sub">Abriendo la caja ${choice}</div><div class="count">${count||'❤️'}</div>`;if(stage==='reveal')card.innerHTML=`<div class="heart">🍝</div><div class="sub">La caja ${choice} eligió...</div><h1 class="menu">Fideos al pesto con salsa y mariscos</h1><div class="msg">EN ESTE MENÚ SÍ COCINAMOS JUNTOS ASÍ HACES TUS FIDEOS ❤️</div>`}function pick(n){choice=n;stage='confirm';render()}function openBox(){stage='count';count=3;render();let t=setInterval(()=>{count--;render();if(count===0){clearInterval(t);setTimeout(()=>{stage='reveal';render()},650)}},850)}render();</script></body></html>
